name: Published MGU Store catalogs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/media-publication.yml
      - media/tools/verify_store_catalogs.py
      - media/RELEASE-EVIDENCE.json
      - catalog.json

permissions:
  contents: read

jobs:
  public-downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published catalogs and packages without a token
        shell: bash
        run: |
          set -euo pipefail
          mkdir source
          curl --fail --silent --show-error --location "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" | tar -xz --strip-components=1 -C source
          python3 source/media/tools/verify_store_catalogs.py | tee publication-verification.json
      - name: Save public download evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-publication-${{ github.run_id }}
          path: publication-verification.json
          retention-days: 30
          if-no-files-found: warn
